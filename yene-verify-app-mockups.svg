<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440" role="img" aria-labelledby="title desc">
  <title id="title">Yene Verify app mockups</title>
  <desc id="desc">Branded mockups for payment verification, merchant dashboard, and sub-merchant dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f4ec"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b9a50"/><stop offset="1" stop-color="#04552d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#174b32" flood-opacity=".14"/></filter>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.ink{fill:#173b2b}.muted{fill:#63756e}.green{fill:#087f3f}.white{fill:#fff}.gold{fill:#b78a24}.red{fill:#c92f35}.line{stroke:#d7e8dd}.label{font:700 20px Arial}.small{font:14px Arial}.body{font:16px Arial}.head{font:700 26px Arial}.title{font:700 34px Arial}
    </style>
  </defs>
  <rect width="1800" height="1440" fill="url(#bg)"/>
  <text x="90" y="78" class="sans title ink">Yene Verify</text><text x="90" y="112" class="sans body muted">Payment verification made simple for every Ethiopian merchant</text>
  <rect x="90" y="145" width="1620" height="2" fill="#b8d9c4"/>

  <!-- Mobile 1: login -->
  <g transform="translate(90 190)" filter="url(#shadow)"><rect width="330" height="520" rx="30" fill="#173b2b"/><rect x="10" y="10" width="310" height="500" rx="23" fill="#fff"/>
    <rect x="10" y="10" width="310" height="145" rx="23" fill="url(#green)"/><circle cx="165" cy="72" r="30" fill="#fff"/><path d="M150 72l11 11 21-25" fill="none" stroke="#087f3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="128" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#fff">Yene Verify</text>
    <text x="38" y="205" class="sans head ink">Welcome back</text><text x="38" y="232" class="sans small muted">Secure your sales before you hand over goods.</text><text x="38" y="278" class="sans small muted">Phone number</text><rect x="38" y="289" width="254" height="43" rx="9" fill="#f4faf6" stroke="#d7e8dd"/><text x="53" y="316" class="sans body muted">+251 9XX XXX XXX</text><text x="38" y="365" class="sans small muted">Password</text><rect x="38" y="376" width="254" height="43" rx="9" fill="#f4faf6" stroke="#d7e8dd"/><text x="53" y="403" class="sans body ink">••••••••</text><rect x="38" y="444" width="254" height="42" rx="9" fill="#087f3f"/><text x="165" y="471" text-anchor="middle" class="sans body white" font-weight="700">Sign in</text></g>
  <text x="255" y="748" text-anchor="middle" class="sans label ink">01  Sign in</text>

  <!-- Mobile 2: dashboard -->
  <g transform="translate(470 190)" filter="url(#shadow)"><rect width="330" height="520" rx="30" fill="#173b2b"/><rect x="10" y="10" width="310" height="500" rx="23" fill="#f4faf6"/><text x="34" y="56" class="sans head ink">Good morning</text><text x="34" y="80" class="sans small muted">Mekdes Store</text><circle cx="276" cy="55" r="22" fill="#d9eee0"/><text x="276" y="62" text-anchor="middle" class="sans body green" font-weight="700">M</text><rect x="28" y="106" width="274" height="110" rx="15" fill="url(#green)"/><text x="48" y="137" class="sans small white">Verified today</text><text x="48" y="178" class="sans" font-size="36" font-weight="700" fill="#fff">24</text><text x="220" y="178" class="sans small" fill="#d8f2df">+18%</text><text x="28" y="255" class="sans head ink">Verify a payment</text><rect x="28" y="273" width="274" height="58" rx="12" fill="#fff" stroke="#b8d9c4"/><circle cx="59" cy="302" r="18" fill="#e1f4e8"/><text x="59" y="309" text-anchor="middle" class="sans body green">+</text><text x="88" y="298" class="sans body ink" font-weight="700">Start verification</text><text x="88" y="318" class="sans small muted">Photo, text, QR, or screenshot</text><text x="28" y="374" class="sans head ink">Recent checks</text><rect x="28" y="390" width="274" height="55" rx="10" fill="#fff"/><circle cx="52" cy="417" r="9" fill="#0b9a50"/><text x="72" y="413" class="sans body ink">5,500 ETB</text><text x="72" y="432" class="sans small muted">CBE  •  Verified</text><text x="28" y="480" class="sans small green" font-weight="700">View history  →</text></g>
  <text x="635" y="748" text-anchor="middle" class="sans label ink">02  Mobile home</text>

  <!-- Mobile 3: verify -->
  <g transform="translate(850 190)" filter="url(#shadow)"><rect width="330" height="520" rx="30" fill="#173b2b"/><rect x="10" y="10" width="310" height="500" rx="23" fill="#fff"/><text x="35" y="55" class="sans head ink">Verify payment</text><text x="35" y="84" class="sans small muted">Choose how to read the receipt</text><rect x="30" y="115" width="270" height="105" rx="16" fill="#e9f7ef" stroke="#087f3f" stroke-width="2"/><circle cx="72" cy="166" r="25" fill="#087f3f"/><text x="72" y="174" text-anchor="middle" class="sans" font-size="28" fill="#fff">⌁</text><text x="112" y="158" class="sans body ink" font-weight="700">Take a photo</text><text x="112" y="181" class="sans small muted">Recommended</text><rect x="30" y="239" width="270" height="60" rx="12" fill="#fff" stroke="#d7e8dd"/><text x="53" y="276" class="sans body ink">Paste receipt text</text><rect x="30" y="315" width="270" height="60" rx="12" fill="#fff" stroke="#d7e8dd"/><text x="53" y="352" class="sans body ink">Scan QR code</text><rect x="30" y="391" width="270" height="60" rx="12" fill="#fff" stroke="#d7e8dd"/><text x="53" y="428" class="sans body ink">Upload screenshot</text><rect x="30" y="468" width="270" height="1" fill="#d7e8dd"/></g>
  <text x="1015" y="748" text-anchor="middle" class="sans label ink">03  Verify options</text>

  <!-- Mobile 4: result -->
  <g transform="translate(1230 190)" filter="url(#shadow)"><rect width="330" height="520" rx="30" fill="#173b2b"/><rect x="10" y="10" width="310" height="500" rx="23" fill="#fff"/><text x="35" y="55" class="sans head ink">Verification result</text><rect x="30" y="86" width="270" height="142" rx="16" fill="#e9f7ef"/><circle cx="165" cy="132" r="30" fill="#087f3f"/><path d="M149 132l11 11 22-27" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="187" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#087f3f">Payment verified</text><text x="35" y="274" class="sans small muted">Amount</text><text x="290" y="274" text-anchor="end" class="sans body ink" font-weight="700">5,500 ETB</text><text x="35" y="310" class="sans small muted">Sender</text><text x="290" y="310" text-anchor="end" class="sans body ink">Abebe K.</text><text x="35" y="346" class="sans small muted">Bank</text><text x="290" y="346" text-anchor="end" class="sans body ink">Commercial Bank</text><text x="35" y="382" class="sans small muted">Reference</text><text x="290" y="382" text-anchor="end" class="sans body ink">CBE-84291</text><rect x="30" y="425" width="270" height="44" rx="9" fill="#087f3f"/><text x="165" y="453" text-anchor="middle" class="sans body white" font-weight="700">Done</text></g>
  <text x="1395" y="748" text-anchor="middle" class="sans label ink">04  Verified result</text>

  <!-- Merchant dashboard -->
  <g transform="translate(90 830)" filter="url(#shadow)"><rect width="760" height="430" rx="18" fill="#fff"/><rect width="170" height="430" rx="18" fill="#123127"/><text x="28" y="45" class="sans" font-size="20" font-weight="700" fill="#fff">Yene Verify</text><text x="28" y="105" class="sans small" fill="#b9d9c4">MAIN MENU</text><text x="28" y="143" class="sans body white" font-weight="700">Overview</text><text x="28" y="180" class="sans body" fill="#b9d9c4">Verifications</text><text x="28" y="217" class="sans body" fill="#b9d9c4">Sub-merchants</text><text x="28" y="254" class="sans body" fill="#b9d9c4">Reports</text><text x="28" y="391" class="sans small" fill="#b9d9c4">Settings  •  Help</text><text x="205" y="48" class="sans title ink" font-size="27">Merchant overview</text><text x="205" y="76" class="sans small muted">Mekdes Trading PLC  /  This month</text><rect x="205" y="105" width="160" height="92" rx="12" fill="#e9f7ef"/><text x="223" y="134" class="sans small muted">Total checks</text><text x="223" y="174" class="sans" font-size="30" font-weight="700" fill="#087f3f">1,284</text><rect x="380" y="105" width="160" height="92" rx="12" fill="#fff8df"/><text x="398" y="134" class="sans small muted">Verified</text><text x="398" y="174" class="sans" font-size="30" font-weight="700" fill="#b78a24">1,241</text><rect x="555" y="105" width="160" height="92" rx="12" fill="#fff0f0"/><text x="573" y="134" class="sans small muted">Flagged</text><text x="573" y="174" class="sans" font-size="30" font-weight="700" fill="#c92f35">43</text><text x="205" y="245" class="sans head ink" font-size="20">Verification activity</text><path d="M220 365 C280 320 300 350 350 295 S430 315 470 250 S540 280 595 220 S680 250 710 190" fill="none" stroke="#087f3f" stroke-width="5"/><path d="M220 365H710M220 365V275" fill="none" stroke="#d7e8dd" stroke-width="2"/><text x="205" y="410" class="sans small muted">Mon          Tue          Wed          Thu          Fri          Sat</text></g>
  <text x="470" y="1300" text-anchor="middle" class="sans label ink">05  Merchant dashboard</text>

  <!-- Sub-merchant dashboard -->
  <g transform="translate(900 830)" filter="url(#shadow)"><rect width="760" height="430" rx="18" fill="#fff"/><rect width="170" height="430" rx="18" fill="#04552d"/><text x="28" y="45" class="sans" font-size="20" font-weight="700" fill="#fff">Yene Verify</text><rect x="20" y="76" width="130" height="56" rx="10" fill="#087f3f"/><text x="35" y="99" class="sans small" fill="#c8efd4">ACCOUNT</text><text x="35" y="119" class="sans body white" font-weight="700">Sub-merchant</text><text x="28" y="180" class="sans body white" font-weight="700">My overview</text><text x="28" y="217" class="sans body" fill="#b9d9c4">My verifications</text><text x="28" y="254" class="sans body" fill="#b9d9c4">My earnings</text><text x="205" y="48" class="sans title ink" font-size="27">Sub-merchant dashboard</text><text x="205" y="76" class="sans small muted">Abebe Electronics  /  Today</text><rect x="205" y="105" width="230" height="92" rx="12" fill="#e9f7ef"/><text x="223" y="134" class="sans small muted">My verified payments</text><text x="223" y="174" class="sans" font-size="30" font-weight="700" fill="#087f3f">86</text><rect x="450" y="105" width="230" height="92" rx="12" fill="#fff8df"/><text x="468" y="134" class="sans small muted">This month</text><text x="468" y="174" class="sans" font-size="30" font-weight="700" fill="#b78a24">48,250 ETB</text><text x="205" y="245" class="sans head ink" font-size="20">Recent payments</text><rect x="205" y="268" width="475" height="43" rx="8" fill="#f4faf6"/><text x="222" y="295" class="sans small muted">CUSTOMER</text><text x="350" y="295" class="sans small muted">AMOUNT</text><text x="535" y="295" class="sans small muted">STATUS</text><text x="222" y="337" class="sans body ink">Dawit M.</text><text x="350" y="337" class="sans body ink">2,400 ETB</text><text x="535" y="337" class="sans small green" font-weight="700">Verified</text><text x="222" y="377" class="sans body ink">Sara T.</text><text x="350" y="377" class="sans body ink">850 ETB</text><text x="535" y="377" class="sans small green" font-weight="700">Verified</text></g>
  <text x="1280" y="1300" text-anchor="middle" class="sans label ink">06  Sub-merchant dashboard</text>
</svg>
